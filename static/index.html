<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog2Tube - 블로그를 유튜브 영상으로</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-row {
            display: flex;
            gap: 15px;
        }
        .input-row .input-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .btn-download {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 15px;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .scene {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .scene-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .scene-script {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .scene-prompt {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .success {
            background: #e6ffe6;
            color: #008800;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .progress-container {
            margin: 20px 0;
        }
        .progress-bar {
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .progress-status {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .step {
            flex: 1;
            text-align: center;
            padding: 10px;
            position: relative;
        }
        .step::after {
            content: '';
            position: absolute;
            top: 20px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #e0e0e0;
            z-index: 0;
        }
        .step:last-child::after {
            display: none;
        }
        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }
        .step.active .step-number {
            background: #667eea;
            color: white;
        }
        .step.completed .step-number {
            background: #38ef7d;
            color: white;
        }
        .step-label {
            font-size: 12px;
            color: #666;
        }
        .video-player {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Blog2Tube</h1>

        <!-- 단계 표시 -->
        <div class="card">
            <div class="step-indicator">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <div class="step-label">블로그 입력</div>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <div class="step-label">대본 생성</div>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <div class="step-label">영상 생성</div>
                </div>
                <div class="step" id="step4">
                    <div class="step-number">4</div>
                    <div class="step-label">완료</div>
                </div>
            </div>
        </div>

        <!-- 입력 카드 -->
        <div class="card" id="inputCard">
            <h2>📝 블로그 글 입력</h2>

            <div class="tabs">
                <button class="tab active" onclick="showTab('manual')">직접 입력</button>
                <button class="tab" onclick="showTab('crawl')">🔗 네이버 블로그 URL</button>
            </div>

            <div id="manual-tab" class="tab-content active">
                <div class="input-group">
                    <label>블로그 글 내용</label>
                    <textarea id="blogContent" placeholder="여기에 블로그 글을 붙여넣으세요..."></textarea>
                </div>
            </div>

            <div id="crawl-tab" class="tab-content">
                <div class="input-group">
                    <label>네이버 블로그 URL</label>
                    <input type="text" id="blogUrl" placeholder="https://blog.naver.com/...">
                </div>
                <button class="btn btn-secondary" onclick="crawlBlog()" style="margin-bottom:20px;">
                    🔍 블로그 가져오기
                </button>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>영상 제목</label>
                    <input type="text" id="videoTitle" placeholder="유튜브 영상 제목">
                </div>
                <div class="input-group">
                    <label>목표 길이 (분)</label>
                    <input type="number" id="duration" value="5" min="1" max="30">
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>음성 선택</label>
                    <select id="voice">
                        <option value="Lily">Lily (여성, 다국어)</option>
                        <option value="Aria">Aria (여성, 다국어)</option>
                        <option value="Roger">Roger (남성, 다국어)</option>
                        <option value="George">George (남성, 다국어)</option>
                        <option value="River">River (중성, 다국어)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>B-roll 이미지</label>
                    <select id="useBroll">
                        <option value="false">사용 안함</option>
                        <option value="true">사용</option>
                    </select>
                </div>
            </div>

            <button class="btn" id="generateBtn" onclick="startGeneration()">
                🚀 영상 생성 시작
            </button>
        </div>

        <!-- 대본 결과 카드 -->
        <div class="card result" id="scriptResult">
            <h2>📜 생성된 대본</h2>
            <div class="loading" id="scriptLoading">
                <div class="spinner"></div>
                <p>Claude가 대본을 작성하고 있습니다...</p>
            </div>
            <div id="scriptContent"></div>
            <button class="btn btn-secondary" id="continueBtn" onclick="generateVideo()" style="display:none; margin-top:20px;">
                🎬 영상 생성 계속하기
            </button>
        </div>

        <!-- 영상 생성 진행 카드 -->
        <div class="card result" id="videoProgress">
            <h2>🎬 영상 생성 중</h2>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                </div>
                <div class="progress-status" id="progressStatus">시작 중...</div>
            </div>
        </div>

        <!-- 완료 카드 -->
        <div class="card result" id="completeCard">
            <h2>✅ 영상 생성 완료!</h2>
            <div class="success">영상이 성공적으로 생성되었습니다.</div>
            <button class="btn btn-download" id="downloadBtn" onclick="downloadVideo()">
                ⬇️ 영상 다운로드
            </button>
        </div>

        <!-- 에러 카드 -->
        <div class="card result" id="errorCard">
            <h2>❌ 오류 발생</h2>
            <div class="error" id="errorMessage"></div>
            <button class="btn" onclick="resetAll()" style="margin-top:15px;">
                🔄 처음부터 다시
            </button>
        </div>
    </div>

    <script>
        let currentVideoId = null;
        let currentScript = null;
        let progressInterval = null;

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        function setStep(stepNum) {
            document.querySelectorAll('.step').forEach((s, i) => {
                s.classList.remove('active', 'completed');
                if (i + 1 < stepNum) s.classList.add('completed');
                if (i + 1 === stepNum) s.classList.add('active');
            });
        }

        function hideAllResults() {
            document.querySelectorAll('.result').forEach(r => r.classList.remove('show'));
        }

        function showError(message) {
            hideAllResults();
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorCard').classList.add('show');
        }

        function resetAll() {
            hideAllResults();
            setStep(1);
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').textContent = '🚀 영상 생성 시작';
            if (progressInterval) clearInterval(progressInterval);
        }

        async function crawlBlog() {
            const url = document.getElementById('blogUrl').value;
            if (!url.trim()) {
                alert('블로그 URL을 입력해주세요.');
                return;
            }

            try {
                const response = await fetch(`/crawl-blog?url=${encodeURIComponent(url)}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('blogContent').value = data.content;
                    document.getElementById('videoTitle').value = data.title;
                    showTab('manual');
                    document.querySelector('.tab').click();
                    alert(`✅ "${data.title}" 블로그를 가져왔습니다!`);
                } else {
                    alert(`❌ 오류: ${data.detail}`);
                }
            } catch (error) {
                alert(`❌ 네트워크 오류: ${error.message}`);
            }
        }

        async function startGeneration() {
            const content = document.getElementById('blogContent').value;
            const title = document.getElementById('videoTitle').value;
            const duration = document.getElementById('duration').value;

            if (!content.trim()) {
                alert('블로그 글 내용을 입력해주세요.');
                return;
            }

            // Step 2: 대본 생성
            setStep(2);
            hideAllResults();
            document.getElementById('scriptResult').classList.add('show');
            document.getElementById('scriptLoading').style.display = 'block';
            document.getElementById('scriptContent').innerHTML = '';
            document.getElementById('continueBtn').style.display = 'none';
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('generateBtn').textContent = '생성 중...';

            try {
                const response = await fetch('/generate-script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: content,
                        target_duration_minutes: parseInt(duration)
                    })
                });

                const data = await response.json();
                document.getElementById('scriptLoading').style.display = 'none';

                if (response.ok) {
                    currentScript = data;
                    displayScript(data);
                    document.getElementById('continueBtn').style.display = 'block';

                    // 자동으로 영상 생성 시작
                    setTimeout(() => generateVideo(), 1000);
                } else {
                    showError(data.detail || '대본 생성 실패');
                }
            } catch (error) {
                showError(`네트워크 오류: ${error.message}`);
            }
        }

        function displayScript(data) {
            let html = `
                <h3 style="margin-bottom:15px;">📺 ${data.title}</h3>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value">${Math.floor(data.total_duration / 60)}분 ${data.total_duration % 60}초</div>
                        <div class="stat-label">예상 길이</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${data.total_characters.toLocaleString()}</div>
                        <div class="stat-label">총 글자수</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${data.scenes.length}</div>
                        <div class="stat-label">장면 수</div>
                    </div>
                </div>
            `;

            data.scenes.forEach((scene, index) => {
                html += `
                    <div class="scene">
                        <div class="scene-title">[${scene.section_title}] - ${scene.estimated_duration}초</div>
                        <div class="scene-script">${scene.script_korean}</div>
                        <div class="scene-prompt">🖼️ ${scene.image_prompt_english}</div>
                    </div>
                `;
            });

            document.getElementById('scriptContent').innerHTML = html;
        }

        async function generateVideo() {
            const content = document.getElementById('blogContent').value;
            const title = document.getElementById('videoTitle').value || 'YouTube Video';
            const voice = document.getElementById('voice').value;
            const useBroll = document.getElementById('useBroll').value === 'true';

            // Step 3: 영상 생성
            setStep(3);
            document.getElementById('videoProgress').classList.add('show');
            document.getElementById('continueBtn').style.display = 'none';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        blog_content: content,
                        title: title,
                        voice: voice,
                        use_broll: useBroll
                    })
                });

                const data = await response.json();

                if (response.ok && data.video_id) {
                    currentVideoId = data.video_id;
                    startProgressPolling();
                } else {
                    showError(data.detail || '영상 생성 시작 실패');
                }
            } catch (error) {
                showError(`네트워크 오류: ${error.message}`);
            }
        }

        function startProgressPolling() {
            progressInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/progress/${currentVideoId}`);
                    const data = await response.json();

                    if (response.ok) {
                        updateProgress(data);

                        if (data.status === 'completed') {
                            clearInterval(progressInterval);
                            showComplete();
                        } else if (data.status === 'error') {
                            clearInterval(progressInterval);
                            showError(data.step || '영상 생성 중 오류 발생');
                        }
                    }
                } catch (error) {
                    console.error('Progress check failed:', error);
                }
            }, 2000);
        }

        function updateProgress(data) {
            const progress = data.progress || 0;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressFill').textContent = progress + '%';
            document.getElementById('progressStatus').textContent = data.step || '처리 중...';
        }

        function showComplete() {
            setStep(4);
            document.getElementById('videoProgress').classList.remove('show');
            document.getElementById('completeCard').classList.add('show');
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').textContent = '🚀 영상 생성 시작';
        }

        function downloadVideo() {
            if (currentVideoId) {
                window.open(`/api/download/${currentVideoId}`, '_blank');
            }
        }
    </script>
</body>
</html>
