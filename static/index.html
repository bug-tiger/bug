<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog2Tube - 블로그를 유튜브 영상으로</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .scene {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .scene-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .scene-script {
            color: #333;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .scene-prompt {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Blog2Tube</h1>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="showTab('script')">📝 대본 생성</button>
                <button class="tab" onclick="showTab('crawl')">🔗 블로그 크롤링</button>
            </div>

            <!-- 대본 생성 탭 -->
            <div id="script-tab" class="tab-content active">
                <div class="input-group">
                    <label>블로그 글 내용</label>
                    <textarea id="blogContent" placeholder="여기에 블로그 글을 붙여넣으세요..."></textarea>
                </div>
                <div class="input-group">
                    <label>목표 영상 길이 (분)</label>
                    <input type="number" id="duration" value="5" min="1" max="30">
                </div>
                <button class="btn" id="generateBtn" onclick="generateScript()">
                    ✨ 대본 생성하기
                </button>
            </div>

            <!-- 블로그 크롤링 탭 -->
            <div id="crawl-tab" class="tab-content">
                <div class="input-group">
                    <label>네이버 블로그 URL</label>
                    <input type="text" id="blogUrl" placeholder="https://blog.naver.com/...">
                </div>
                <button class="btn" onclick="crawlBlog()">
                    🔍 블로그 가져오기
                </button>
            </div>
        </div>

        <!-- 결과 영역 -->
        <div class="card result" id="result">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Claude가 대본을 작성하고 있습니다...</p>
            </div>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        async function generateScript() {
            const content = document.getElementById('blogContent').value;
            const duration = document.getElementById('duration').value;

            if (!content.trim()) {
                alert('블로그 글 내용을 입력해주세요.');
                return;
            }

            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');
            const resultContent = document.getElementById('resultContent');
            const btn = document.getElementById('generateBtn');

            resultDiv.classList.add('show');
            loading.style.display = 'block';
            resultContent.innerHTML = '';
            btn.disabled = true;
            btn.textContent = '생성 중...';

            try {
                const response = await fetch('/generate-script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: content,
                        target_duration_minutes: parseInt(duration)
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (response.ok) {
                    displayResult(data);
                } else {
                    resultContent.innerHTML = `<div class="error">❌ 오류: ${data.detail}</div>`;
                }
            } catch (error) {
                loading.style.display = 'none';
                resultContent.innerHTML = `<div class="error">❌ 네트워크 오류: ${error.message}</div>`;
            }

            btn.disabled = false;
            btn.textContent = '✨ 대본 생성하기';
        }

        async function crawlBlog() {
            const url = document.getElementById('blogUrl').value;

            if (!url.trim()) {
                alert('블로그 URL을 입력해주세요.');
                return;
            }

            try {
                const response = await fetch(`/crawl-blog?url=${encodeURIComponent(url)}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('blogContent').value = data.content;
                    showTab('script');
                    document.querySelector('.tab').click();
                    alert(`✅ "${data.title}" 블로그를 가져왔습니다!\n\n대본 생성 탭에서 내용을 확인하세요.`);
                } else {
                    alert(`❌ 오류: ${data.detail}`);
                }
            } catch (error) {
                alert(`❌ 네트워크 오류: ${error.message}`);
            }
        }

        function displayResult(data) {
            const resultContent = document.getElementById('resultContent');

            let html = `
                <h3>📺 ${data.title}</h3>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value">${Math.floor(data.total_duration / 60)}분 ${data.total_duration % 60}초</div>
                        <div class="stat-label">예상 길이</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${data.total_characters.toLocaleString()}</div>
                        <div class="stat-label">총 글자수</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${data.scenes.length}</div>
                        <div class="stat-label">장면 수</div>
                    </div>
                </div>
            `;

            data.scenes.forEach((scene, index) => {
                html += `
                    <div class="scene">
                        <div class="scene-title">[${scene.section_title}] - ${scene.estimated_duration}초</div>
                        <div class="scene-script">${scene.script_korean}</div>
                        <div class="scene-prompt">🖼️ ${scene.image_prompt_english}</div>
                    </div>
                `;
            });

            resultContent.innerHTML = html;
        }
    </script>
</body>
</html>
