<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog2Tube - Asset Kit Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
            line-height: 1.6;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .btn-download {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            margin-top: 15px;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .progress-container {
            margin: 20px 0;
        }
        .progress-bar {
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .progress-status {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .step {
            flex: 1;
            text-align: center;
            padding: 10px;
            position: relative;
        }
        .step::after {
            content: '';
            position: absolute;
            top: 20px;
            right: -50%;
            width: 100%;
            height: 2px;
            background: #e0e0e0;
            z-index: 0;
        }
        .step:last-child::after {
            display: none;
        }
        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e0e0e0;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }
        .step.active .step-number {
            background: #667eea;
            color: white;
        }
        .step.completed .step-number {
            background: #38ef7d;
            color: white;
        }
        .step-label {
            font-size: 12px;
            color: #666;
        }
        .error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .success {
            background: #e6ffe6;
            color: #008800;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .info-box {
            background: #e6f3ff;
            color: #0066cc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }
        .file-list {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-name {
            font-weight: 500;
            color: #333;
        }
        .file-size {
            color: #888;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .stat {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #e0e0e0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blog2Tube</h1>
        <p class="subtitle">Vrew / CapCut 편집용 Asset Kit 생성기</p>

        <!-- 단계 표시 -->
        <div class="card">
            <div class="step-indicator">
                <div class="step active" id="step1">
                    <div class="step-number">1</div>
                    <div class="step-label">텍스트 입력</div>
                </div>
                <div class="step" id="step2">
                    <div class="step-number">2</div>
                    <div class="step-label">문장 분석</div>
                </div>
                <div class="step" id="step3">
                    <div class="step-number">3</div>
                    <div class="step-label">이미지 생성</div>
                </div>
                <div class="step" id="step4">
                    <div class="step-number">4</div>
                    <div class="step-label">완료</div>
                </div>
            </div>
        </div>

        <!-- 입력 카드 -->
        <div class="card" id="inputCard">
            <h2>블로그 글 입력</h2>

            <div class="info-box">
                <strong>Asset Kit이란?</strong>
                블로그 글을 문장 단위로 분석하여, 각 문장에 맞는 고품질 이미지를 생성합니다.<br>
                생성된 이미지와 오디오를 Vrew나 CapCut에서 불러와 쉽게 영상을 완성할 수 있습니다.
            </div>

            <div class="tabs">
                <button class="tab active" onclick="showTab('manual')">직접 입력</button>
                <button class="tab" onclick="showTab('crawl')">네이버 블로그 URL</button>
            </div>

            <div id="manual-tab" class="tab-content active">
                <div class="input-group">
                    <label>블로그 글 내용</label>
                    <textarea id="blogContent" placeholder="여기에 블로그 글을 붙여넣으세요...

예시:
오늘은 건강한 수면 습관에 대해 알아보겠습니다. 성인은 하루 7-9시간의 수면이 권장됩니다. 잠들기 전 스마트폰 사용을 줄이면 수면의 질이 향상됩니다. 규칙적인 수면 시간을 유지하는 것이 중요합니다."></textarea>
                </div>
            </div>

            <div id="crawl-tab" class="tab-content">
                <div class="input-group">
                    <label>네이버 블로그 URL</label>
                    <input type="text" id="blogUrl" placeholder="https://blog.naver.com/...">
                </div>
                <button class="btn" onclick="crawlBlog()" style="margin-bottom:20px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                    블로그 가져오기
                </button>
            </div>

            <div class="input-group">
                <label>프로젝트 이름 (폴더명에 사용)</label>
                <input type="text" id="projectName" placeholder="예: 수면습관_영상" value="project">
            </div>

            <button class="btn" id="generateBtn" onclick="startGeneration()">
                Asset Kit 생성 시작
            </button>
        </div>

        <!-- 진행 상황 카드 -->
        <div class="card result" id="progressCard">
            <h2>Asset Kit 생성 중...</h2>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                </div>
                <div class="progress-status" id="progressStatus">시작 중...</div>
            </div>
        </div>

        <!-- 완료 카드 -->
        <div class="card result" id="completeCard">
            <h2>Asset Kit 생성 완료!</h2>
            <div class="success" id="successMessage">파일이 성공적으로 생성되었습니다.</div>

            <div class="stats" id="resultStats"></div>

            <div class="file-list" id="fileList">
                <h3 style="margin-bottom:15px;">생성된 파일</h3>
                <div id="fileItems"></div>
            </div>

            <button class="btn btn-download" id="downloadBtn" onclick="downloadAssets()">
                ZIP 파일 다운로드
            </button>

            <button class="btn" onclick="resetAll()" style="margin-top:10px; background: #888;">
                새로 만들기
            </button>
        </div>

        <!-- 에러 카드 -->
        <div class="card result" id="errorCard">
            <h2>오류 발생</h2>
            <div class="error" id="errorMessage"></div>
            <button class="btn" onclick="resetAll()" style="margin-top:15px;">
                처음부터 다시
            </button>
        </div>
    </div>

    <script>
        let currentJobId = null;
        let progressInterval = null;

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        function setStep(stepNum) {
            document.querySelectorAll('.step').forEach((s, i) => {
                s.classList.remove('active', 'completed');
                if (i + 1 < stepNum) s.classList.add('completed');
                if (i + 1 === stepNum) s.classList.add('active');
            });
        }

        function hideAllResults() {
            document.querySelectorAll('.result').forEach(r => r.classList.remove('show'));
        }

        function showError(message) {
            hideAllResults();
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorCard').classList.add('show');
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').textContent = 'Asset Kit 생성 시작';
        }

        function resetAll() {
            hideAllResults();
            setStep(1);
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').textContent = 'Asset Kit 생성 시작';
            if (progressInterval) clearInterval(progressInterval);
            currentJobId = null;
        }

        async function crawlBlog() {
            const url = document.getElementById('blogUrl').value;
            if (!url.trim()) {
                alert('블로그 URL을 입력해주세요.');
                return;
            }

            try {
                const response = await fetch(`/crawl-blog?url=${encodeURIComponent(url)}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('blogContent').value = data.content;
                    document.getElementById('projectName').value = data.title.substring(0, 20);
                    showTab('manual');
                    document.querySelector('.tab').click();
                    alert(`"${data.title}" 블로그를 가져왔습니다!`);
                } else {
                    alert(`오류: ${data.detail}`);
                }
            } catch (error) {
                alert(`네트워크 오류: ${error.message}`);
            }
        }

        async function startGeneration() {
            const content = document.getElementById('blogContent').value;
            const projectName = document.getElementById('projectName').value || 'project';

            if (!content.trim()) {
                alert('블로그 글 내용을 입력해주세요.');
                return;
            }

            // 시작
            setStep(2);
            hideAllResults();
            document.getElementById('progressCard').classList.add('show');
            document.getElementById('generateBtn').disabled = true;
            document.getElementById('generateBtn').textContent = '생성 중...';

            try {
                const response = await fetch('/generate-assets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: content,
                        project_name: projectName
                    })
                });

                const data = await response.json();

                if (response.ok && data.job_id) {
                    currentJobId = data.job_id;
                    startProgressPolling();
                } else {
                    showError(data.detail || 'Asset Kit 생성 시작 실패');
                }
            } catch (error) {
                showError(`네트워크 오류: ${error.message}`);
            }
        }

        function startProgressPolling() {
            progressInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/assets/progress/${currentJobId}`);
                    const data = await response.json();

                    if (response.ok) {
                        updateProgress(data);

                        // 단계 업데이트
                        if (data.progress > 30 && data.progress <= 75) {
                            setStep(3);
                        } else if (data.progress > 75) {
                            setStep(4);
                        }

                        if (data.status === 'completed') {
                            clearInterval(progressInterval);
                            showComplete(data);
                        } else if (data.status === 'error') {
                            clearInterval(progressInterval);
                            showError(data.error || data.step || 'Asset Kit 생성 중 오류 발생');
                        }
                    }
                } catch (error) {
                    console.error('Progress check failed:', error);
                }
            }, 2000);
        }

        function updateProgress(data) {
            const progress = data.progress || 0;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressFill').textContent = progress + '%';
            document.getElementById('progressStatus').textContent = data.step || '처리 중...';
        }

        async function showComplete(data) {
            setStep(4);
            hideAllResults();
            document.getElementById('completeCard').classList.add('show');
            document.getElementById('generateBtn').disabled = false;
            document.getElementById('generateBtn').textContent = 'Asset Kit 생성 시작';

            // 파일 목록 가져오기
            try {
                const response = await fetch(`/assets/files/${currentJobId}`);
                const filesData = await response.json();

                if (response.ok) {
                    // 통계 표시
                    const imageCount = filesData.files.filter(f => f.name.endsWith('.png')).length;
                    const hasAudio = filesData.files.some(f => f.name.endsWith('.mp3'));

                    document.getElementById('resultStats').innerHTML = `
                        <div class="stat">
                            <div class="stat-value">${imageCount}</div>
                            <div class="stat-label">이미지</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${hasAudio ? '1' : '0'}</div>
                            <div class="stat-label">오디오</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${filesData.total}</div>
                            <div class="stat-label">총 파일</div>
                        </div>
                    `;

                    // 파일 목록 표시
                    let filesHtml = '';
                    filesData.files.forEach(file => {
                        const sizeKB = (file.size / 1024).toFixed(1);
                        filesHtml += `
                            <div class="file-item">
                                <span class="file-name">${file.name}</span>
                                <span class="file-size">${sizeKB} KB</span>
                            </div>
                        `;
                    });
                    document.getElementById('fileItems').innerHTML = filesHtml;

                    document.getElementById('successMessage').textContent =
                        `${filesData.output_dir} 폴더에 파일이 생성되었습니다.`;
                }
            } catch (error) {
                console.error('Failed to fetch file list:', error);
            }
        }

        function downloadAssets() {
            if (currentJobId) {
                window.open(`/assets/download/${currentJobId}`, '_blank');
            }
        }
    </script>
</body>
</html>
